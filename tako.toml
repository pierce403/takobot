[workspace]
name = "Tako"
version = 1

[life]
stage = "hatchling"

[dose.baseline]
# 0..1. Defaults bias toward steady/calm without being flat.
d = 0.55
o = 0.55
s = 0.55
e = 0.55

[productivity]
daily_outcomes = 3
weekly_review_day = "sun"

[updates]
# Auto-apply package updates and restart TUI when a newer takobot release is detected.
auto_apply = true

[learning]
# Draft reusable skills from operator experiences; activation requires measured evaluation.
enabled = true
review_every = 5
daily_call_budget = 12
cooldown_seconds = 300
max_context_chars = 2400
max_active_skills = 3
# Set true to evaluate/promote automatically against your fixed evaluations.json suite.
auto_promote = false

[world_watch]
# RSS/Atom feeds to monitor for world-watch notes + briefings.
feeds = []
# Websites to sample during child-stage curiosity exploration.
sites = []
# Feed polling cadence in minutes.
poll_minutes = 30

[security.download]
# Maximum download size for skill/tool packages (quarantine fetch).
max_bytes = 15000000
# Optional allowlist. Empty = allow any https domain.
allowlist_domains = []

[security.defaults]
# Default permissions for enabled workspace code (skills/tools).
# Operator-approved installs are enabled; enabled != unrestricted.
network = true
shell = true
xmtp = true
filesystem = true
